# Despliegue en Render (https://render.com) — "New → Blueprint" y elige este repositorio.
# Necesita un plan de pago (Starter) porque el disco persistente guarda la base de datos SQLite.
services:
  - type: web
    name: artia
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/salud
    disk:
      name: artia-datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: DB_PATH, value: /var/data/artia.db }
      - { key: PRECIO_ESTUDIANTE, value: "24900" }
      - { key: PRECIO_MENTOR, value: "59900" }
      # Estas las escribes tú en el panel de Render (no se guardan en GitHub):
      - { key: BASE_URL, sync: false }              # https://tu-dominio.com
      - { key: ADMIN_EMAILS, sync: false }          # tu correo de administrador
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: WOMPI_PUBLIC_KEY, sync: false }
      - { key: WOMPI_INTEGRITY_SECRET, sync: false }
      - { key: WOMPI_EVENTS_SECRET, sync: false }
